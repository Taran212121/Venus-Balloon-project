scenario:
  name: "venus_balloon_baseline"

planet:
  body: venus

simulation:
  start_time: "2035-01-01T00:00:00Z"
  duration_days: 15
  dt_s: 60

balloon:
  initial:
    latitude_deg: 0.0
    longitude_deg: 0.0
    altitude_m: 52000.0

orbiter:
  initial_orbit:
    semi_major_axis_m: 40000000.0
    eccentricity: 0.0
    inclination_deg: 80.0
    raan_deg: 0.0
    argument_of_periapsis_deg: 0.0
    true_anomaly_deg: 0.0
    